<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praveen's HUB</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-mode">
    <div class="background-decorations">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <div class="dashboard-container">
        <!-- HEADER -->
        <header class="main-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <i data-lucide="layers"></i>
                </div>
                <div>
                    <h1>ProjectHub</h1>
                    <p class="subtitle">Instant Local Application Cockpit</p>
                </div>
            </div>

            <button class="btn btn-text refresh-btn" id="btn-refresh">
                <i data-lucide="refresh-cw"></i> Rescan Projects
            </button>
        </header>

        <!-- FILTERS & CONTROLS -->
        <section class="controls-bar">
            <div class="search-box">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="search-input" placeholder="Search workspace projects...">
            </div>
        </section>

        <!-- MAIN PROJECT GRID -->
        <main class="projects-grid-section">
            <div class="grid-header">
                <h2>All Workspace Projects (<span id="filtered-count">0</span>)</h2>
            </div>

            <div class="projects-grid" id="projects-grid">
                <div class="loading-placeholder">
                    <div class="spinner"></div>
                    <p>Scanning workspace directories...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>

</html>
